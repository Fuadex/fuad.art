<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — Fuad Soudah</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
<meta name="theme-color" content="#060606" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter+Tight:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --black:#060606; --fg:#f3f1ec; --fg-2:#9a978f; --fg-3:#5a5852; --gold:#c8a96a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--black); color:var(--fg); }
  body {
    font-family:"Inter Tight", system-ui, sans-serif; font-weight:300;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px 24px; overflow:hidden; position:relative;
  }
  body::after {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
  }
  #grain {
    position:fixed; inset:0; pointer-events:none; z-index:3; opacity:0.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .content { position:relative; z-index:4; }
  .micro { font-size:10.5px; letter-spacing:0.32em; text-transform:uppercase; color:var(--fg-3); }
  .gold { color:var(--gold); }
  h1 {
    font-family:"Cormorant Garamond", serif; font-weight:300;
    font-size:clamp(40px, 9vw, 92px); line-height:1.02; margin:26px 0 20px;
  }
  h1 .it { font-style:italic; }
  .code { font-family:"Cormorant Garamond", serif; font-style:italic; font-size:22px; color:var(--fg-3); }
  p { font-size:15px; letter-spacing:0.04em; color:var(--fg-2); max-width:440px; margin:0 auto; line-height:1.7; }
  .home {
    display:inline-block; margin-top:40px; font-size:11px; letter-spacing:0.22em;
    text-transform:uppercase; color:var(--fg-2); text-decoration:none;
    border-bottom:1px solid var(--fg-3); padding-bottom:6px; transition:color .25s, border-color .25s;
  }
  .home:hover { color:var(--gold); border-color:var(--gold); }
</style>
</head>
<body>
  <div id="grain"></div>
  <div class="content">
    <div class="micro gold">Error 404</div>
    <h1>This shot didn't <span class="it">render</span>.</h1>
    <p>The page you're after doesn't exist — or it was left on the cutting-room floor.</p>
    <a class="home" href="/">← Back to fuad.art</a>
    <div class="code" style="margin-top:44px;">// frame not found</div>
  </div>
</body>
</html>
